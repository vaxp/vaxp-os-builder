shadows = 0
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 20
shadows_blur = 18
shadows_position_x = -20
shadows_position_y = -20
shadowscolor= 0x987a90ff
enable_edge_snap = 1
edge_snap_threshold = 20
edge_snap_corner_size = 80
edge_snap_preview_alpha = 0.45
edge_snap_preview_color = 0x2a324cff

border_radius=15
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0


animations=1
layer_animations=1
animation_slide_direction=1
tag_animation_direction=1
animation_type_open=slide-left
animation_type_close=slide-right

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_nmaster=1
smartgaps=0
## default size of new window
default_mfact=0.5


# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
inhibit_regardless_of_visibility=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=15
gappiv=15
gap_outer_left=10
gap_outer_right=10
#gap_outer_top=43
#gap_outer_bottom=58
gap_outer_top=5
gap_outer_bottom=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1
rootcolor=0x2a324cff
bordercolor=0x2a324cff
focuscolor=0x2a324cff
maximizescreencolor=0x2a324cff
urgentcolor=0xad401fff
scratchpadcolor=0x2a324cff
globalcolor=0x2a324cff
overlaycolor=0x2a324cff


# blur settings
blur = 1
blur_layer = 1
blur_params_num_passes = 2
#stringth
blur_params_radius = 3
blur_params_noise = 0
blur_params_brightness = 1
blur_params_contrast = 1
blur_params_saturation = 1
# this cache's the blurred background onto the layer's background
# windows beneath the layer will not show since it's a static background when enabled
blur_optimized=0

source=~/.config/aether/env.conf
source=~/.config/aether/keybindings.conf
source=~/.config/aether/rules.conf
source=~/.config/aether/exec.conf  